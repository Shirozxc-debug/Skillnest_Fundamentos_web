<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matias Santelices">
    <title>Social Like</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body class="body">

    <header class="header">
        <nav class="navbar">
            <h1 class="logo">Social Like</h1>
        </nav>
    </header>

    <main class="main">
        <div>
            <section class="perfil-seccion">
                <div class="Contenedor-img">
                    <img src="static/images/Misato (1).png" alt="images">
                </div>
                <div>
                    <h1 class="p">Misato</h1>
                </div>
                <div>
                    <button class="btn-perfil">Mi perfil</button>
                </div>
            </section>
        </div>
        <section>
            <div>
                <h2 class="h2">Últimas publicaciones</h2>
            </div>
            
            <div class="encerrado">
                <div class="row">
                    <h2>Rei</h2>
                    <div class="btn-likes">
                        <span id="rei">0 Like(s)</span>
                        <button id="btn-rei" class="btn-like">Like</button>
                    </div>
                </div>
                <p>Acabo de configurar este nuevo <a href="#">bot de Discord</a>, cuéntame qué opinan ustedes.</p>
            </div>

            <div class="encerrado">
                <div class="row">
                    <h2>Asuka</h2>
                    <div class="btn-likes">
                        <span id="asuka">0 Like(s)</span>
                        <button id="btn-asuka" class="btn-like">Like</button>
                    </div>
                </div>
                <p>Acabo de leer este <a href="#">nuevo comic</a>. Denle un vistazo.</p>
            </div>

            <div class="encerrado">
                <div class="row">
                    <h2>Shinji</h2>
                    <div class="btn-likes">
                        <span id="shinji">0 Like(s)</span>
                        <button id="btn-shinji" class="btn-like">Like</button>
                    </div>
                </div>
                <p>No puedo dejar de escuchar este <a href="#">album</a>. ¿A quién más le gusta?</p>
            </div>
        </section>
    </main>

    <script src="static/js/script.js"></script>
</body>

</html>
