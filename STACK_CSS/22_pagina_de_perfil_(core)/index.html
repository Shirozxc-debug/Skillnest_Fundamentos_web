<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Matias Santelices">
    <title>Document</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header class="header">
        <nav class="barra-nav">Perfil</nav>
        <div class="nav">
            <a href="#">Inicio</a>
            <a href="#">Mi perfil</a>
            <a href="#">Conexiones</a>
            <button class="boton">Cerrar Sesión</button>
        </div>
    </header>
    <main class="contenedor-principal">
        <section class="columna-izquierda">
            <div class="tarjeta-perfil">
                <div class="superior-azul"></div>
                <div class="descripcion-tarjeta">
                    <div class="contenedor-img">
                        <img src="static/images/descarga-modified.png" alt="icono">
                    </div>
                    <h1 class="ache1">Jane Doe</h1>
                    <p class="p">Bergen, Noruega</p>
                    <p class="p1">Desarrolladora Frontend</p>
                    <p class="p1">Conocimientos en HTML, CSS, JavaScript</p>
                    <div class="link-perfil">
                        <a href="#">⚙ Editar perfil</a>
                    </div>
                </div>
            </div>
        </section>
        <section class="columna-derecha">
            <div class="tarjeta-conexiones">
                <div class="row">
                    <h2>Solicitudes de conexión</h2>
                    <button class="btn">Ver todas</button>
                </div>
                <div class="row">
                    <div class="caja">
                        <img src="static/images/descarga-modified.png" alt="Steve Jobs">
                        <p>Steve Jobs</p>
                    </div>
                    <div class="botones">✅❌</div>
                </div>
                <div class="row">
                    <div class="caja">
                        <img src="static/images/descarga-modified.png" alt="Bill Gates">
                        <p>Bill Gates</p>
                    </div>
                    <div class="botones">✅❌</div>
                </div>
            </div>
            <div class="tarjeta-conexiones">
                <div class="row">
                    <h2>Tus conexiones</h2>
                    <button class="btn">Ver todas</button>
                </div>
                <div class="row">
                    <div class="caja">
                        <img src="static/images/descarga-modified.png" alt="Richard Stallman">
                        <p>Richard Stallman</p>
                    </div>
                </div>
                <div class="row">
                    <div class="caja">
                        <img src="static/images/descarga-modified.png" alt="Linus Torvalds">
                        <p>Linus Torvalds</p>
                    </div>
                </div>
                <div class="row">
                    <div class="caja">
                        <img src="static/images/descarga-modified.png" alt="Ada Lovelace">
                        <p>Ada Lovelace</p>
                    </div>
                </div>
                <div class="row">
                    <div class="caja">
                        <img src="static/images/descarga-modified.png" alt="Grace Hopper">
                        <p>Grace Hopper</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>

</html>
